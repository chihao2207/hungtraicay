<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hứng Trái Cây vui Vẻ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body {
            background: linear-gradient(135deg, #1a1c29, #32234f);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 600px;
            max-height: 900px;
            background: linear-gradient(to bottom, #87CEEB, #E0F6FF);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        .score-board {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
        }
        .p1-score { color: #FF4757; }
        .p2-score { color: #2ED573; }
        .menu-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            backdrop-filter: blur(5px);
        }
        h1 {
            font-size: 36px;
            color: #FFD700;
            text-shadow: 0 0 10px #FFA500;
            margin-bottom: 10px;
            text-align: center;
        }
        p {
            font-size: 14px;
            margin-bottom: 25px;
            color: #ddd;
            text-align: center;
            padding: 0 20px;
            line-height: 1.5;
        }
        .btn {
            background: linear-gradient(45deg, #FF6B6B, #FF8E53);
            border: none;
            padding: 15px 35px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-p2 {
            background: linear-gradient(45deg, #2ED573, #1E90FF);
            box-shadow: 0 5px 15px rgba(46, 213, 115, 0.4);
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div class="ui-layer">
        <div class="score-board">
            <div id="p1-ui" class="p1-score">P1: 0</div>
            <div id="timer-ui" style="color: #333;">Thời gian: 60</div>
            <div id="p2-ui" class="p2-score" style="display:none;">P2: 0</div>
        </div>
    </div>

    <!-- Menu Khởi Động -->
    <div id="menu" class="menu-overlay">
        <h1>HỨNG TRÁI CÂY NHA ĐỒ NGỐC</h1>
        <p>
            <b>1 Người:</b> Dùng phím A/D, Mũi tên hoặc Vuốt màn hình.<br>
            <b>2 Người:</b> P1 (A/D - Nửa trái), P2 (Mũi tên - Nửa phải).<br>
           Nhớ Né Bom 💣 không né nó nổ banh...!
        </p>
        <button class="btn" onclick="startGame(1)">1 NGƯỜI CHƠI</button>
        <button class="btn btn-p2" onclick="startGame(2)">2 NGƯỜI CHƠI</button>
    </div>

    <!-- Menu Kết Thúc -->
    <div id="game-over" class="menu-overlay" style="display: none;">
        <h1 id="winner-text">KẾT THÚC!</h1>
        <p id="final-score"></p>
        <button class="btn" onclick="showMenu()">CLICK VÔ MÌNH ĐỂ CHƠI LẠI NHÉ🥺</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('game-container');

    // Thiết lập kích thước Canvas
    function resizeCanvas() {
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Context Âm thanh (Web Audio API)
    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'catch') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'bomb') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }
    }

    // Biến trạng thái trò chơi
    let gameMode = 1; // 1 hoặc 2 người
    let isPlaying = false;
    let timer = 60;
    let timerInterval = null;
    let shakeTime = 0;

    // Vật phẩm (Trái cây & Bom)
    const items = [];
    const itemTypes = [
        { emoji: '🍎', pts: 10, speed: 4 },
        { emoji: '🍌', pts: 15, speed: 5 },
        { emoji: '🍉', pts: 20, speed: 3 },
        { emoji: '🍓', pts: 25, speed: 6 },
        { emoji: '💣', pts: -30, speed: 7, isBomb: true }
    ];

    // Hiệu ứng hạt (Particles)
    const particles = [];
    function createParticles(x, y, color) {
        for (let i = 0; i < 12; i++) {
            particles.push({
                x, y,
                vx: (Math.random() - 0.5) * 8,
                vy: (Math.random() - 0.5) * 8,
                radius: Math.random() * 5 + 2,
                color: color,
                alpha: 1
            });
        }
    }

    // Đối tượng Người chơi
    class Player {
        constructor(id, color, x) {
            this.id = id;
            this.color = color;
            this.width = 80;
            this.height = 20;
            this.x = x;
            this.y = canvas.height - 50;
            this.score = 0;
            this.speed = 8;
            this.moveLeft = false;
            this.moveRight = false;
        }

        draw() {
            ctx.save();
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = this.color;
            
            // Vẽ rổ dạng bo góc
            ctx.beginPath();
            ctx.roundRect(this.x, this.y, this.width, this.height, 10);
            ctx.fill();

            // Nhãn hiệu P1 / P2
            ctx.fillStyle = "#FFF";
            ctx.font = "bold 12px Arial";
            ctx.textAlign = "center";
            ctx.fillText("P" + this.id, this.x + this.width / 2, this.y + 14);
            ctx.restore();
        }

        update() {
            if (this.moveLeft && this.x > 0) this.x -= this.speed;
            if (this.moveRight && this.x < canvas.width - this.width) this.x += this.speed;
            this.y = canvas.height - 50; // Giữ vị trí đáy khi resize
        }
    }

    let p1 = new Player(1, '#FF4757', 0);
    let p2 = new Player(2, '#2ED573', 0);

    // Xử lý Điều khiển Phím (Windows)
    const keys = {};
    window.addEventListener('keydown', (e) => {
        keys[e.code] = true;
        updateMovement();
    });
    window.addEventListener('keyup', (e) => {
        keys[e.code] = false;
        updateMovement();
    });

    function updateMovement() {
        p1.moveLeft = keys['KeyA'];
        p1.moveRight = keys['KeyD'];

        if (gameMode === 1) {
            // Ở chế độ 1 người, dùng cả phím mũi tên cho P1
            if (keys['ArrowLeft']) p1.moveLeft = true;
            if (keys['ArrowRight']) p1.moveRight = true;
        } else {
            p2.moveLeft = keys['ArrowLeft'];
            p2.moveRight = keys['ArrowRight'];
        }
    }

    // Xử lý Cảm ứng & Chuột (Mobile + Windows)
    function handlePointer(x, y) {
        if (!isPlaying) return;
        initAudio();

        if (gameMode === 1) {
            p1.x = x - p1.width / 2;
        } else {
            // Chia đôi màn hình cho 2 người chơi cảm ứng
            if (x < canvas.width / 2) {
                p1.x = x - p1.width / 2;
            } else {
                p2.x = x - p2.width / 2;
            }
        }
    }

    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        for (let i = 0; i < e.touches.length; i++) {
            const touch = e.touches[i];
            const rect = canvas.getBoundingClientRect();
            handlePointer(touch.clientX - rect.left, touch.clientY - rect.top);
        }
    }, { passive: false });

    canvas.addEventListener('mousemove', (e) => {
        if (e.buttons === 1) { // Click và kéo chuột
            const rect = canvas.getBoundingClientRect();
            handlePointer(e.clientX - rect.left, e.clientY - rect.top);
        }
    });

    // Sinh vật phẩm ngẫu nhiên
    function spawnItem() {
        if (!isPlaying) return;
        const type = itemTypes[Math.floor(Math.random() * itemTypes.length)];
        items.push({
            x: Math.random() * (canvas.width - 30) + 15,
            y: -30,
            size: 30,
            ...type
        });
        
        // Tốc độ sinh vật phẩm nhanh dần
        setTimeout(spawnItem, Math.random() * 600 + 400);
    }

    // Khởi động Trò chơi
    function startGame(mode) {
        initAudio();
        gameMode = mode;
        isPlaying = true;
        timer = 60;
        
        p1 = new Player(1, '#FF4757', canvas.width / (mode === 2 ? 4 : 2) - 40);
        p2 = new Player(2, '#2ED573', (canvas.width / 4) * 3 - 40);

        items.length = 0;
        particles.length = 0;

        document.getElementById('p2-ui').style.display = mode === 2 ? 'block' : 'none';
        document.getElementById('menu').style.display = 'none';
        document.getElementById('game-over').style.display = 'none';

        updateUI();

        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timer--;
            document.getElementById('timer-ui').innerText = `Thời gian: ${timer}`;
            if (timer <= 0) endGame();
        }, 1000);

        spawnItem();
    }

    function updateUI() {
        document.getElementById('p1-ui').innerText = `P1: ${p1.score}`;
        if (gameMode === 2) {
            document.getElementById('p2-ui').innerText = `P2: ${p2.score}`;
        }
    }

    function endGame() {
        isPlaying = false;
        clearInterval(timerInterval);
        
        const gameOverDiv = document.getElementById('game-over');
        const winnerText = document.getElementById('winner-text');
        const finalScore = document.getElementById('final-score');

        gameOverDiv.style.display = 'flex';

        if (gameMode === 1) {
            winnerText.innerText = "HẾT GIỜ RỒI ĐỒ NGỐC ĐÁNG YÊU À!";
            finalScore.innerText = `Điểm của bạn: ${p1.score}`;
        } else {
            if (p1.score > p2.score) {
                winnerText.innerText = "THẰNG SỐ 1 THẮNG RỒI!";
            } else if (p2.score > p1.score) {
                winnerText.innerText = "Ê TAO SỐ 2 THẮNG NHA!";
            } else {
                winnerText.innerText = "CHƠI LẠI ĐI HÒA NHAU RỒI!";
            }
            finalScore.innerText = `P1: ${p1.score} | P2: ${p2.score}`;
        }
    }

    function showMenu() {
        document.getElementById('game-over').style.display = 'none';
        document.getElementById('menu').style.display = 'flex';
    }

    // Vòng lặp Game (Game Loop)
    function gameLoop() {
        ctx.save();

        // Hiệu ứng Rung màn hình khi trúng bom
        if (shakeTime > 0) {
            ctx.translate((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10);
            shakeTime--;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (isPlaying) {
            // Cập nhật & Vẽ Người chơi
            p1.update();
            p1.draw();
            if (gameMode === 2) {
                p2.update();
                p2.draw();
            }

            // Vẽ & Xử lý Trái cây
            for (let i = items.length - 1; i >= 0; i--) {
                const item = items[i];
                item.y += item.speed;

                // Vẽ Emoji Trái cây/Bom
                ctx.font = "30px Arial";
                ctx.textAlign = "center";
                ctx.fillText(item.emoji, item.x, item.y);

                // Kiểm tra Va chạm với P1
                const players = [p1];
                if (gameMode === 2) players.push(p2);

                players.forEach(p => {
                    if (
                        item.y + 10 >= p.y &&
                        item.y - 20 <= p.y + p.height &&
                        item.x >= p.x &&
                        item.x <= p.x + p.width
                    ) {
                        p.score = Math.max(0, p.score + item.pts);
                        
                        if (item.isBomb) {
                            playSound('bomb');
                            shakeTime = 10;
                            createParticles(item.x, item.y, '#555');
                        } else {
                            playSound('catch');
                            createParticles(item.x, item.y, p.color);
                        }

                        updateUI();
                        items.splice(i, 1);
                    }
                });

                // Xóa vật phẩm khi rơi khỏi màn hình
                if (item && item.y > canvas.height + 30) {
                    items.splice(i, 1);
                }
            }

            // Vẽ & Cập nhật Hiệu ứng Hạt (Particles)
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;

                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                if (p.alpha <= 0) particles.splice(i, 1);
            }
        }

        ctx.restore();
        requestAnimationFrame(gameLoop);
    }

    // Chạy vòng lặp
    gameLoop();
</script>
</body>
</html>
